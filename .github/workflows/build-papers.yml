# ==============================================================
# build-papers.yml — auto-publish papers created via the admin
# --------------------------------------------------------------
# Trigger: any commit touching papers/ or js/papers-data.json
# (that includes every "Save & publish" from admin.html, which
# commits markdown into papers/data/ through the Worker proxy).
# Steps: install deps -> run build.py -> commit generated files
# back to main -> GitHub Pages serves the updated site.
# The workflow skips itself if its own commit re-triggers it
# ([skip build] marker), preventing an infinite loop.
# ==============================================================
name: Build papers site

on:
  push:
    branches: [main]
    paths:
      - "papers/**"
      - "js/papers-data.json"
      - "build.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install fpdf2 markdown

      - name: Generate pages, PDFs and feed.json
        run: python3 build.py

      - name: Commit generated output (if changed)
        run: |
          git config user.name  "iep-build-bot"
          git config user.email "bot@innovationearthprojects.org"
          git add -A papers downloads
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Rebuild paper pages, PDFs and feed [skip build]"
            git push origin HEAD:main
          fi
